{% extends "base.html" %}
{% block title %}Login — Exam AI{% endblock %}
{% block content %}
<div class="card">
  <h1>Login</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<div class="msg error">Invalid credentials. Try again.</div>{% endif %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <button type="submit" style="margin-top:1rem">Log in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'register' %}">Register here</a>.</p>
</div>
{% endblock %}
