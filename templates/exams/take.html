{% extends "base.html" %}
{% block content %}
<h1>{{ attempt.exam.title }}</h1>
<form method="post">
  {% csrf_token %}
  {% for q in attempt.exam.questions.all %}
    <div class="card">
      <p><strong>{{ forloop.counter }}. {{ q.text }}</strong></p>
      {% for c in q.choices.all %}
        <label style="display:block; font-weight:400">
          <input type="radio" name="question_{{ q.id }}" value="{{ c.id }}"> {{ c.text }}
        </label>
      {% endfor %}
    </div>
  {% endfor %}
  <button type="submit">Submit</button>
</form>
{% endblock %}
