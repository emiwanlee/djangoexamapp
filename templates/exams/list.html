{% extends "base.html" %}
{% block content %}
<h1>Exams</h1>
{% if exams %}
  <ul>
    {% for e in exams %}
      <li>
        {{ e.title }} — {{ e.duration_minutes }} min, pass mark {{ e.pass_mark }}
        <a class="btn" href="{% url 'start_exam' e.id %}">Start</a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <div class="card">
    <p class="muted">No published exams yet. Add one in <a href="/admin/exams/exam/add/">the admin</a>.</p>
  </div>
{% endif %}
{% endblock %}
